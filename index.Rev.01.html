<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LPHPP Futsal 2027 — Tournament Schedule & Standings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cordia+New:wght@400;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand Palette from LPHPP Futsal 2027_Rev.02.pdf */
      --brand-red: #FF0000;
      --brand-navy: #203764;
      --brand-yellow: #FFFF00;
      --brand-peach: #F8CBAD;

      /* Dark Mode Default (Modern Sports Dashboard) */
      --bg: #0b1324;
      --bg-elevated: #13203b;
      --surface: #182848;
      --surface-hover: #1f335a;
      --border: #2a4170;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --header-bg: linear-gradient(135deg, #203764 0%, #101d36 65%, #2b1222 100%);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      --qualify-bg: rgba(34, 197, 94, 0.12);
      --qualify-border: #22c55e;
      --badge-yellow-bg: rgba(255, 255, 0, 0.16);
      --badge-yellow-ink: #FFFF00;
      --badge-peach-bg: rgba(248, 203, 173, 0.18);
      --badge-peach-ink: #F8CBAD;
      --badge-red-bg: rgba(255, 0, 0, 0.2);
      --badge-red-ink: #ff6b6b;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font: "Cordia New", "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html[data-theme="light"] {
      --bg: #f1f5f9;
      --bg-elevated: #e2e8f0;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #cbd5e1;
      --ink: #0f172a;
      --muted: #475569;
      --header-bg: linear-gradient(135deg, #203764 0%, #182b4f 75%, #3b1523 100%);
      --card-shadow: 0 2px 10px rgba(32, 55, 100, 0.08);
      --qualify-bg: rgba(22, 163, 74, 0.08);
      --qualify-border: #16a34a;
      --badge-yellow-bg: #FFFF00;
      --badge-yellow-ink: #203764;
      --badge-peach-bg: #F8CBAD;
      --badge-peach-ink: #203764;
      --badge-red-bg: rgba(255, 0, 0, 0.12);
      --badge-red-ink: #cc0000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      font-size: 22px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Header & Banner */
    .site-header {
      background: var(--header-bg);
      color: #ffffff;
      border-bottom: 3px solid var(--brand-red);
      position: relative;
      overflow: hidden;
    }

    .site-header::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 255, 0, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: var(--space-6);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .logo-emblem {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--brand-navy);
      border: 2px solid var(--brand-yellow);
      box-shadow: 0 0 16px rgba(255, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .logo-emblem svg {
      width: 32px;
      height: 32px;
      color: var(--brand-yellow);
    }

    .logo-tag {
      position: absolute;
      bottom: -6px;
      background: var(--brand-red);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .brand-titles h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--brand-peach);
      font-size: 19px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .ctrl-btn {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.45);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--brand-yellow);
    }

    .ctrl-btn:focus-visible {
      outline: 2px solid var(--brand-yellow);
      outline-offset: 2px;
    }

    .ctrl-btn.admin-badge {
      background: #e11d48;
      border-color: #f43f5e;
      color: #ffffff;
    }

    /* Main Container */
    .main-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    /* Navigation Tabs & Filter Bar */
    .top-controls-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .nav-tabs {
      display: flex;
      gap: var(--space-2);
      background: var(--bg-elevated);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .tab-btn {
      font: inherit;
      font-size: 21px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: var(--brand-navy);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      border-bottom: 2px solid var(--brand-red);
    }

    html[data-theme="dark"] .tab-btn.active {
      background: var(--brand-red);
      color: #ffffff;
      border-bottom: 2px solid var(--brand-yellow);
    }

    /* Filters & Search Bar */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-6);
      box-shadow: var(--card-shadow);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-3);
      align-items: end;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-field label {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      font: inherit;
      font-size: 19px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--ink);
      transition: border-color 0.2s ease;
    }

    .input-wrap .filter-input {
      padding-left: 36px;
    }

    .filter-input:focus,
    .filter-select:focus {
      outline: none;
      border-color: var(--brand-red);
    }

    /* Stage / Round Pills */
    .stage-pills {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: var(--space-4);
    }

    .pill-btn {
      font: inherit;
      font-size: 19px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      border-color: var(--brand-peach);
      color: var(--ink);
    }

    .pill-btn.active {
      background: var(--brand-navy);
      color: var(--brand-yellow);
      border-color: var(--brand-yellow);
    }

    /* Section Animation */
    .tab-panel {
      animation: fadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Notice Bar */
    .data-mode-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border-left: 4px solid var(--brand-navy);
      margin-bottom: var(--space-4);
      font-size: 18px;
    }

    .data-mode-bar.admin-active {
      border-left-color: #e11d48;
      background: rgba(225, 29, 72, 0.1);
    }

    .data-mode-bar strong {
      color: var(--ink);
    }

    /* Matches Week Grouping */
    .week-block {
      margin-bottom: var(--space-6);
    }

    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding: 10px 16px;
      background: var(--brand-navy);
      color: #ffffff;
      border-left: 4px solid var(--brand-yellow);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-3);
    }

    .week-title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-date-badge {
      font-size: 18px;
      background: rgba(255, 255, 255, 0.14);
      padding: 3px 10px;
      border-radius: 99px;
      color: var(--brand-peach);
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--space-3);
    }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .match-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-red);
      background: var(--surface-hover);
    }

    .match-card.is-edited {
      border-left: 4px solid #e11d48;
    }

    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: 16px;
      color: var(--muted);
    }

    .group-tag {
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--badge-peach-bg);
      color: var(--badge-peach-ink);
    }

    .status-badge {
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .status-upcoming {
      background: var(--bg-elevated);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-finished {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    html[data-theme="light"] .status-finished {
      color: #15803d;
    }

    .status-live {
      background: var(--badge-red-bg);
      color: var(--badge-red-ink);
      border: 1px solid var(--brand-red);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-red);
      animation: pulseDot 1.2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .match-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: var(--space-2);
    }

    .team-side {
      font-weight: 700;
      font-size: 22px;
      line-height: 1.3;
      word-break: break-word;
    }

    .team-side.home {
      text-align: right;
    }

    .team-side.away {
      text-align: left;
    }

    .score-box {
      min-width: 90px;
      text-align: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 24px;
      background: var(--badge-yellow-bg);
      color: var(--badge-yellow-ink);
      border: 1px solid rgba(255, 255, 0, 0.35);
    }

    .score-box.has-score {
      background: var(--brand-navy);
      color: var(--brand-yellow);
      border-color: var(--brand-red);
      letter-spacing: 1px;
    }

    .match-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 17px;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }

    /* Standings Tables */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: var(--space-6);
    }

    @media (max-width: 540px) {
      .standings-grid {
        grid-template-columns: 1fr;
      }
      .matches-grid {
        grid-template-columns: 1fr;
      }
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .group-card-header {
      background: var(--brand-navy);
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--brand-red);
    }

    .group-card-header h3 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .sport-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
    }

    .sport-table th,
    .sport-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    .sport-table th:first-child,
    .sport-table td:first-child,
    .sport-table th:nth-child(2),
    .sport-table td:nth-child(2) {
      text-align: left;
    }

    .sport-table th {
      background: var(--bg-elevated);
      color: var(--muted);
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
    }

    .sport-table tr:hover td {
      background: var(--surface-hover);
    }

    .sport-table tr.qualify-row td {
      background: var(--qualify-bg);
    }

    .sport-table tr.qualify-row td:first-child {
      border-left: 4px solid var(--qualify-border);
    }

    .rank-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 16px;
      background: var(--bg-elevated);
    }

    .qualify-row .rank-num {
      background: var(--qualify-border);
      color: #ffffff;
    }

    .pts-cell {
      font-weight: 800;
      color: var(--brand-red);
      font-size: 22px;
    }

    html[data-theme="dark"] .pts-cell {
      color: var(--brand-yellow);
    }

    /* Rules Card */
    .rules-card {
      margin-top: var(--space-6);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--brand-yellow);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-6);
      box-shadow: var(--card-shadow);
    }

    .rules-card h4 {
      margin: 0 0 8px;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }

    .rules-card ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 19px;
    }

    /* Top Scorers */
    .scorers-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .goal-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 6px 14px;
      border-radius: 99px;
      background: var(--brand-red);
      color: #ffffff;
      font-weight: 800;
      font-size: 19px;
    }

    /* Admin Quick Editor inside Modal */
    .admin-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: var(--space-3);
      text-align: left;
    }

    .admin-form-group label {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-peach);
    }

    .admin-input-row {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .admin-score-input {
      width: 80px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      padding: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: var(--radius-sm);
    }

    .admin-team-input {
      flex: 1;
      padding: 10px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: var(--radius-sm);
      font-size: 19px;
    }

    .admin-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .passcode-box {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg-elevated);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .passcode-input {
      font: inherit;
      font-size: 18px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      width: 160px;
    }

    /* Scorer Manager Styles */
    .scorer-manager-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      box-shadow: var(--card-shadow);
    }

    .scorer-manager-panel h3 {
      margin: 0 0 var(--space-3) 0;
      font-size: 20px;
      color: var(--brand-peach);
    }

    .scorer-grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-3);
      align-items: end;
    }

    .scorer-btn-delete {
      background: #e11d48;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: bold;
    }

    .scorer-btn-delete:hover {
      background: #be123c;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Load modified or custom matches from local storage if any
    const STORAGE_KEY = "lphpp_futsal_2027_matches";
    let storedMatches = null;
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        storedMatches = JSON.parse(stored);
      }
    } catch (e) {
      console.warn("localStorage not accessible", e);
    }

    // Complete 76 matches from LPHPP Futsal 2027_Rev.02.pdf (Completely Clean)
    const INITIAL_OFFICIAL_MATCHES = [

    function computeStandings() {
      const result = {};
      GROUPS_CONFIG.forEach(cfg => {
        const stats = {};
        cfg.teams.forEach((t, idx) => {
          stats[t] = { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, initialOrder: idx };
        });

        OFFICIAL_MATCHES.forEach(m => {
          if (m.group === cfg.key) {
            let score = null;
            let finished = false;

            if (m.userScore) {
              score = m.userScore;
              finished = (m.userState === "finished");
            }

            if (score && finished) {
              const [hg, ag] = score;
              if (!stats[m.home]) {
                stats[m.home] = { team: m.home, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, initialOrder: 99 };
              }
              if (!stats[m.away]) {
                stats[m.away] = { team: m.away, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, initialOrder: 99 };
              }

              const h = stats[m.home];
              const a = stats[m.away];

              h.p += 1; a.p += 1;
              h.gf += hg; h.ga += ag; h.gd = h.gf - h.ga;
              a.gf += ag; a.ga += hg; a.gd = a.gf - a.ga;

              if (hg > ag) {
                h.w += 1; h.pts += 3;
                a.l += 1;
              } else if (hg < ag) {
                a.w += 1; a.pts += 3;
                h.l += 1;
              } else {
                h.d += 1; h.pts += 1;
                a.d += 1; a.pts += 1;
              }
            }
          }
        });

        // Sort strictly according to PDF rules:
        const sorted = Object.values(stats).sort((x, y) => {
          if (y.pts !== x.pts) return y.pts - x.pts;
          if (y.gf !== x.gf) return y.gf - x.gf;
          if (x.ga !== y.ga) return x.ga - y.ga;
          return x.initialOrder - y.initialOrder;
        });

        result[cfg.key] = sorted;
      });
      return result;
    }

    function getUniqueDates() {
      const seen = new Set();
      const list = [];
      OFFICIAL_MATCHES.forEach(m => {
        if (!seen.has(m.date)) {
          seen.add(m.date);
          list.push({ date: m.date, day: m.day, week: m.week });
        }
      });
      return list;
    }

    function getAllTeams() {
      const list = [];
      GROUPS_CONFIG.forEach(cfg => {
        cfg.teams.forEach(t => {
          if (!list.includes(t)) list.push(t);
        });
      });
      list.sort((x, y) => x.localeCompare(y, "th"));
      return list;
    }

      const m = OFFICIAL_MATCHES.find(match => match.item === itemNum);
      if (m) {

        m.away = awayTeamName;
        if (hScore === "" || aScore === "") {
          m.userScore = null;
          m.userState = "upcoming";
        } else {
          m.userScore = [parseInt(hScore), parseInt(aScore)];
          m.userState = status;
        }

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(OFFICIAL_MATCHES));
        } catch (e) {
          console.error(e);
        }
      }
      closeMatchModal();
      render();

    function renderMatchesPanel(t) {
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = OFFICIAL_MATCHES.filter(m => {
        if (state.stageFilter !== "all" && m.stage !== state.stageFilter) return false;
        if (state.groupFilter !== "all" && m.group !== state.groupFilter) return false;
        if (state.dateFilter !== "all" && m.date !== state.dateFilter) return false;
        if (state.courtFilter !== "all" && m.court !== state.courtFilter) return false;
        if (q) {
          const hay = `${m.home} ${m.away} ${m.code} ${m.date} ${m.week}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const stages = [
        { id: "all", label: t.stageAll },
        { id: "group", label: t.stageGroup },
        { id: "qf", label: t.stageQF },
        { id: "sf", label: t.stageSF },
        { id: "final", label: t.stageFinal }
      ];

      const stagePillsHtml = `
        <div class="stage-pills">
          ${stages.map(s => `
            <button class="pill-btn ${state.stageFilter === s.id ? 'active' : ''}" onclick="setStage('${s.id}')">
              ${s.label}
            </button>
          `).join("")}
        </div>
      `;

      if (filtered.length === 0) {
        return `
          ${stagePillsHtml}
          <div class="empty-state">
            <p>${t.emptyText}</p>
            <button class="ctrl-btn" onclick="resetFilters()">${t.resetBtn}</button>
          </div>
        `;
      }

      const weeksMap = new Map();
      filtered.forEach(m => {
        const key = `${m.week}__${m.day} ${m.date}`;
        if (!weeksMap.has(key)) weeksMap.set(key, []);
        weeksMap.get(key).push(m);
      });

      let blocksHtml = "";
      weeksMap.forEach((matches, key) => {
        const [weekTitle, dateStr] = key.split("__");
        blocksHtml += `
          <div class="week-block">
            <div class="week-header">
              <div class="week-title">${Icons.calendar} ${weekTitle}</div>
              <span class="week-date-badge">${dateStr} (${matches.length} Matches)</span>
            </div>
            <div class="matches-grid">
              ${matches.map(m => {
                let status = "upcoming";
                let score = null;
                let isEdited = !!m.userScore;

                if (m.userScore) {
                  score = m.userScore;
                  status = m.userState;
                }

                let statusBadge = `<span class="status-badge status-upcoming">${t.statusUpcoming}</span>`;
                if (status === "live") {
                  statusBadge = `<span class="status-badge status-live"><span class="live-dot"></span>${t.statusLive}</span>`;
                } else if (status === "finished") {
                  statusBadge = `<span class="status-badge status-finished">${t.statusFinished}</span>`;
                }

                const scoreText = score ? `${score[0]} - ${score[1]}` : "V";
                const scoreClass = score ? "score-box has-score" : "score-box";

                return `
                  <div class="match-card ${isEdited ? 'is-edited' : ''}" onclick="openMatchModal(${m.item})">
                    <div class="match-meta">
                      <span class="group-tag">#${m.item} • ${m.code}</span>
                      ${statusBadge}
                    </div>
                    <div class="match-teams">
                      <div class="team-side home">${m.home}</div>
                      <div class="${scoreClass}">${scoreText}</div>
                      <div class="team-side away">${m.away}</div>
                    </div>
                    <div class="match-footer">
                      <span>${Icons.clock} ${m.time}</span>
                      <span>${Icons.mapPin} ${m.court}</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      });

      return `${stagePillsHtml}<div class="tab-panel">${blocksHtml}</div>`;
    }

    function renderStandingsPanel(t) {
      const allStandings = computeStandings();
      const q = state.searchQuery.trim().toLowerCase();

      const groupsToRender = GROUPS_CONFIG.filter(cfg => {
        if (state.groupFilter !== "all" && cfg.key !== state.groupFilter) return false;
        if (q) {
          return cfg.teams.some(team => team.toLowerCase().includes(q));
        }
        return true;
      });

      if (groupsToRender.length === 0) {
        return `
          <div class="empty-state">
            <p>${t.emptyText}</p>
            <button class="ctrl-btn" onclick="resetFilters()">${t.resetBtn}</button>
          </div>
        `;
      }

      const cardsHtml = groupsToRender.map(cfg => {
        const rows = allStandings[cfg.key] || [];
        const groupTitle = state.lang === "th" ? cfg.titleTh : cfg.titleEn;
        return `
          <div class="group-card">
            <div class="group-card-header">
              <h3>${Icons.trophy} ${groupTitle}</h3>
              <span style="font-size:12px; color: var(--brand-peach);">${t.qualifyZone}</span>
            </div>
            <div class="table-wrap">
              <table class="sport-table">
                <thead>
                  <tr>
                    <th>${t.thRank}</th>
                    <th>${t.thTeam}</th>
                    <th>${t.thP}</th>
                    <th>${t.thW}</th>
                    <th>${t.thD}</th>
                    <th>${t.thL}</th>
                    <th>${t.thGF}</th>
                    <th>${t.thGA}</th>
                    <th>${t.thPts}</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((r, idx) => {
                    const isQualify = idx < cfg.qualifyCount;
                    const highlightTeam = q && r.team.toLowerCase().includes(q);
                    return `
                      <tr class="${isQualify ? 'qualify-row' : ''}" style="${highlightTeam ? 'outline: 2px solid var(--brand-yellow);' : ''}">
                        <td><span class="rank-num">${idx + 1}</span></td>
                        <td style="font-weight:700;">${r.team}</td>
                        <td>${r.p}</td>
                        <td>${r.w}</td>
                        <td>${r.d}</td>
                        <td>${r.l}</td>
                        <td>${r.gf}</td>
                        <td>${r.ga}</td>
                        <td class="pts-cell">${r.pts}</td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="tab-panel">
          <div class="standings-grid">${cardsHtml}</div>
          <div class="rules-card">
            <h4>${Icons.sparkles} ${t.rulesTitle}</h4>
            <p style="margin:0 0 6px; font-size:14px; color:var(--brand-peach);">${t.ruleDraw}</p>
            <ol>
              <li>${t.rule1}</li>
              <li>${t.rule2}</li>
              <li>${t.rule3}</li>
            </ol>
          </div>
        </div>
      `;
    }

    function renderScorersPanel(t) {
      const q = state.searchQuery.trim().toLowerCase();
      
      // Filter scorers by selected Category Tab and search query
      const categorizedScorers = topScorersList.filter(s => s.category === state.scorerCategoryFilter);
      
      const rows = categorizedScorers.filter(s => {
        if (!q) return true;
        return s.player.toLowerCase().includes(q) || s.club.toLowerCase().includes(q);
      });

      // Sort by goals descending, then by player name
      rows.sort((x, y) => {
        if (y.goals !== x.goals) return y.goals - x.goals;
        return x.player.localeCompare(y.player, "th");
      });

      const allTeams = getAllTeams();

      return `
        <div class="tab-panel">
          <div class="data-mode-bar">
            <span>${Icons.flame} <strong>${t.scorerNote}</strong></span>
          </div>

          <!-- Category Sub-tabs for Top Scorers -->
          <div style="display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px;">
            <button class="pill-btn ${state.scorerCategoryFilter === 'men' ? 'active' : ''}" onclick="setScorerCategory('men')">
              ${t.scorerTabMen}
            </button>
            <button class="pill-btn ${state.scorerCategoryFilter === 'senior' ? 'active' : ''}" onclick="setScorerCategory('senior')">
              ${t.scorerTabSenior}
            </button>
            <button class="pill-btn ${state.scorerCategoryFilter === 'women' ? 'active' : ''}" onclick="setScorerCategory('women')">
              ${t.scorerTabWomen}
            </button>
          </div>

          <!-- Scorer Manager Panel (Only shown in Admin Mode) -->
          ${state.adminMode ? `
            <div class="scorer-manager-panel">
              <h3>⚡ ${t.scorerAddTitle}</h3>
              <form onsubmit="event.preventDefault(); addNewScorer(
                document.getElementById('scorer-new-name').value,
                document.getElementById('scorer-new-team').value,
                document.getElementById('scorer-new-cat').value,
                document.getElementById('scorer-new-goals').value
              ); document.getElementById('scorer-new-name').value=''; document.getElementById('scorer-new-goals').value='0';">
                
                <div class="scorer-grid-form">
                  <div class="filter-field">
                    <label>${t.scorerInputName}</label>
                    <input type="text" id="scorer-new-name" class="filter-input" placeholder="เช่น นายสี่สิบ สองเก้า" required />
                  </div>

                  <div class="filter-field">
                    <label>${t.scorerInputTeam}</label>
                    <select id="scorer-new-team" class="filter-select">
                      ${allTeams.map(team => `<option value="${team}">${team}</option>`).join("")}
                    </select>
                  </div>

                  <div class="filter-field">
                    <label>${t.scorerInputCategory}</label>
                    <select id="scorer-new-cat" class="filter-select" onchange="document.getElementById('scorer-new-cat').value = this.value;">
                      <option value="men" ${state.scorerCategoryFilter === 'men' ? 'selected' : ''}>${t.scorerTabMen}</option>
                      <option value="senior" ${state.scorerCategoryFilter === 'senior' ? 'selected' : ''}>${t.scorerTabSenior}</option>
                      <option value="women" ${state.scorerCategoryFilter === 'women' ? 'selected' : ''}>${t.scorerTabWomen}</option>
                    </select>
                  </div>

                  <div class="filter-field">
                    <label>${t.scorerInputGoals}</label>
                    <input type="number" min="0" id="scorer-new-goals" class="filter-input" value="1" inputmode="numeric" />
                  </div>

                  <button type="submit" class="ctrl-btn admin-badge" style="height: 50px; font-size: 18px; width: 100%;">
                    ${t.scorerActionSave}
                  </button>
                </div>
              </form>
            </div>
          ` : ''}

          <div class="scorers-card">
            <div class="table-wrap">
              <table class="sport-table">
                <thead>
                  <tr>
                    <th>${t.thRank}</th>
                    <th>${t.thPlayer}</th>
                    <th>${t.thClub}</th>
                    <th>${t.thGoals}</th>
                    ${state.adminMode ? `<th>การจัดการ (Action)</th>` : ''}
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((s, idx) => `
                    <tr>
                      <td><span class="rank-num">${idx + 1}</span></td>
                      <td style="font-weight:700;">${s.player}</td>
                      <td>${s.club}</td>
                      <td><span class="goal-pill">${s.goals}</span></td>
                      ${state.adminMode ? `
                        <td>
                          <button class="scorer-btn-delete" onclick="deleteScorer(${s.id})">ลบ (Delete)</button>
                        </td>
                      ` : ''}
                    </tr>
                  `).join("")}
                  ${rows.length === 0 ? `
                    <tr>
                      <td><span class="rank-num">-</span></td>
                      <td style="font-weight:700; text-align: left;">-</td>
                      <td style="text-align: left;">-</td>
                      <td><span class="goal-pill">-</span></td>
                      ${state.adminMode ? `<td>-</td>` : ''}
                    </tr>
                  ` : ''}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderModal(t) {
      const m = state.selectedMatch;
      if (!m) return "";

      let activeHome = m.home;
      let opponentKey = m.away;
      let activeScore = null;
      let activeState = "upcoming";

      if (m.userScore) {
        activeScore = m.userScore;
        activeState = m.userState;
      }

      const hScoreVal = activeScore ? activeScore[0] : "";
      const aScoreVal = activeScore ? activeScore[1] : "";

      const scoreDisplay = activeScore ? `${activeScore[0]} - ${activeScore[1]}` : "V";
      const hasScoreClass = activeScore ? "score-box has-score" : "score-box";

      const isPlayoff = m.stage !== "group";

      return `
        <div class="modal-backdrop" onclick="if(event.target===this) closeMatchModal()">
          <div class="modal-box" style="max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
              <h3 style="margin:0; font-size:18px;">${t.modalTitle} (#${m.item})</h3>
              <button class="close-btn" onclick="closeMatchModal()">✕</button>
            </div>
            
            <div style="text-align:center; padding: 6px 0 16px;">
              <div style="margin-bottom:10px;">
                <span class="group-tag">${m.code} • ${m.week}</span>
              </div>
              <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin: 16px 0;">
                <div style="font-size:18px; font-weight:800; text-align:right;">${activeHome}</div>
                <div class="${hasScoreClass}" style="font-size:20px; padding:8px 16px;">${scoreDisplay}</div>
                <div style="font-size:18px; font-weight:800; text-align:left;">${opponentKey}</div>
              </div>
              <div style="font-size:14px; color:var(--muted); display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:12px;">
                <span>${Icons.calendar} ${m.day}, ${m.date}</span>
                <span>${Icons.clock} ${m.time}</span>
                <span>${Icons.mapPin} ${m.court}</span>
              </div>
            </div>

            ${state.adminMode ? `
              <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:16px;">
                <h4 style="margin:0 0 12px; font-size:14px; color:var(--brand-yellow); display:flex; align-items:center; gap:6px;">
                  ${Icons.settings} ${t.adminEditLabel}
                </h4>
                
                <div class="admin-form-group">
                  <label>${t.scoreHomeLabel} (${activeHome})</label>
                  <div class="admin-input-row">
                    <input type="text" id="admin-home-name" class="admin-team-input" value="${activeHome}" ${isPlayoff ? '' : 'readonly title="ชื่อทีมรอบแบ่งกลุ่มฟิกซ์ตามไฟล์ PDF" style="opacity:0.6;"'} />
                    <input type="number" min="0" id="admin-score-home" class="admin-score-input" value="${hScoreVal}" placeholder="-" inputmode="numeric" />
                  </div>
                </div>

                <div class="admin-form-group">
                  <label>${t.scoreAwayLabel} (${opponentKey})</label>
                  <div class="admin-input-row">
                    <input type="text" id="admin-away-name" class="admin-team-input" value="${opponentKey}" ${isPlayoff ? '' : 'readonly title="ชื่อทีมรอบแบ่งกลุ่มฟิกซ์ตามไฟล์ PDF" style="opacity:0.6;"'} />
                    <input type="number" min="0" id="admin-score-away" class="admin-score-input" value="${aScoreVal}" placeholder="-" inputmode="numeric" />
                  </div>
                </div>

                <div class="admin-form-group">
                  <label for="admin-status">${t.statusLabel}</label>
                  <select id="admin-status" class="filter-select">
                    <option value="upcoming" ${activeState === 'upcoming' ? 'selected' : ''}>${t.statusUpcoming}</option>
                    <option value="live" ${activeState === 'live' ? 'selected' : ''}>${t.statusLive}</option>
                    <option value="finished" ${activeState === 'finished' ? 'selected' : ''}>${t.statusFinished}</option>
                  </select>
                </div>

                <div class="admin-btn-row">
                  <button class="ctrl-btn btn-secondary" onclick="closeMatchModal()" style="color:var(--ink);">ยกเลิก</button>
                  <button class="ctrl-btn admin-badge" onclick="saveMatchResult(
                    ${m.item},
                    document.getElementById('admin-home-name').value,
                    document.getElementById('admin-away-name').value,
                    document.getElementById('admin-score-home').value,
                    document.getElementById('admin-score-away').value,
                    document.getElementById('admin-status').value
                  )">
                    ${t.saveBtn}
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function render() {
      const t = I18N[state.lang];
      const uniqueDates = getUniqueDates();

      let activeContent = "";
      if (state.activeTab === "matches") activeContent = renderMatchesPanel(t);
      else if (state.activeTab === "standings") activeContent = renderStandingsPanel(t);
      else activeContent = renderScorersPanel(t);

      const root = document.getElementById("root");
      root.innerHTML = `
        <header class="site-header">
          <div class="header-inner">
            <div class="brand-group">
              <div class="logo-emblem" title="LPHPP Futsal 2027 Emblem">
                ${Icons.trophy}
                <span class="logo-tag">2027</span>
              </div>
              <div class="brand-titles">
                <h1>${t.title}</h1>
                <p class="brand-subtitle">${t.subtitle}</p>
              </div>
            </div>
            <div class="header-actions">
              <button class="ctrl-btn" onclick="toggleLang()">
                ${Icons.globe}
                <span>${state.lang === "th" ? "TH / EN" : "EN / TH"}</span>
              </button>
              <button class="ctrl-btn" onclick="toggleTheme()">
                ${state.theme === "dark" ? Icons.sun : Icons.moon}
                <span>${state.theme === "dark" ? "Light" : "Dark"}</span>
              </button>
              ${state.adminMode ? `
                <button class="ctrl-btn admin-badge" onclick="handleAdminLogout()">
                  <span>Logout Admin</span>
                </button>
              ` : ''}
            </div>
          </div>
        </header>

        <main class="main-container">
          <div class="data-mode-bar ${state.adminMode ? 'admin-active' : ''}">
            <span>
              <strong>${state.adminMode ? '🔒 โหมดผู้ดูแลระบบ (Admin Mode Active)' : '🏆 ตารางการแข่งขันและคะแนนอย่างเป็นทางการ (Official Stats)'}</strong>
              — ${state.adminMode ? t.modeNoticeOfficial : 'ข้อมูลแบบสดเรียลไทม์ตามความคืบหน้าของงาน'}
            </span>
            
            ${state.adminMode ? `
              <button class="ctrl-btn admin-badge" onclick="resetAllRealResults()" style="font-size:12px; padding: 4px 10px;">
                ${t.resetMatchesBtn}
              </button>
            ` : `
              <div class="passcode-box">
                <span style="font-size:12px; color:var(--muted);">สำหรับผู้ดูแลระบบ กรอกรหัสเพื่อแก้ไขผลแข่ง:</span>
                <input type="password" class="passcode-input" placeholder="Passcode" value="${state.adminPinInput}" oninput="state.adminPinInput=this.value;" />
                <button class="ctrl-btn" style="padding:2px 8px; font-size:11px;" onclick="handleAdminPinSubmit()">Login</button>
              </div>
            `}
          </div>

          <div class="top-controls-grid">
            <nav class="nav-tabs" aria-label="Main Tabs">
              <button class="tab-btn ${state.activeTab === 'matches' ? 'active' : ''}" onclick="setTab('matches')">
                ${Icons.calendar} ${t.tabMatches}
              </button>
              <button class="tab-btn ${state.activeTab === 'standings' ? 'active' : ''}" onclick="setTab('standings')">
                ${Icons.table} ${t.tabStandings}
              </button>
              <button class="tab-btn ${state.activeTab === 'scorers' ? 'active' : ''}" onclick="setTab('scorers')">
                ${Icons.flame} ${t.tabScorers}
              </button>
            </nav>
          </div>

          <section class="filter-card" aria-label="Filters and Search">
            <div class="filter-field">
              <label for="search-input">${t.searchLabel}</label>
              <div class="input-wrap">
                ${Icons.search}
                <input
                  id="search-input"
                  type="text"
                  class="filter-input"
                  placeholder="${t.searchPlaceholder}"
                  value="${state.searchQuery.replace(/"/g, '&quot;')}"
                  oninput="handleSearchInput(this.value)"
                />
              </div>
            </div>

            <div class="filter-field">
              <label for="group-select">${t.groupLabel}</label>
              <select id="group-select" class="filter-select" onchange="state.groupFilter=this.value; render();">
                <option value="all" ${state.groupFilter === 'all' ? 'selected' : ''}>${t.allGroups}</option>
                <option value="A" ${state.groupFilter === 'A' ? 'selected' : ''}>Group A (ชาย)</option>
                <option value="B" ${state.groupFilter === 'B' ? 'selected' : ''}>Group B (ชาย)</option>
                <option value="C" ${state.groupFilter === 'C' ? 'selected' : ''}>Group C (ชาย)</option>
                <option value="D" ${state.groupFilter === 'D' ? 'selected' : ''}>Group D (ชาย)</option>
                <option value="อาวุโส" ${state.groupFilter === 'อาวุโส' ? 'selected' : ''}>อาวุโส (Senior)</option>
                <option value="หญิง" ${state.groupFilter === 'หญิง' ? 'selected' : ''}>หญิง (Women)</option>
              </select>
            </div>

            <div class="filter-field">
              <label for="date-select">${t.dateLabel}</label>
              <select id="date-select" class="filter-select" onchange="state.dateFilter=this.value; render();">
                <option value="all" ${state.dateFilter === 'all' ? 'selected' : ''}>${t.allDates}</option>
                ${uniqueDates.map(d => `
                  <option value="${d.date}" ${state.dateFilter === d.date ? 'selected' : ''}>
                    ${d.week}: ${d.day} ${d.date}
                  </option>
                `).join("")}
              </select>
            </div>

            <div class="filter-field">
              <label for="court-select">${t.courtLabel}</label>
              <select id="court-select" class="filter-select" onchange="state.courtFilter=this.value; render();">
                <option value="all" ${state.courtFilter === 'all' ? 'selected' : ''}>${t.allCourts}</option>
                <option value="สนามกีฬา LPHPP" ${state.courtFilter === 'สนามกีฬา LPHPP' ? 'selected' : ''}>สนามกีฬา LPHPP</option>
              </select>
            </div>
          </section>

          ${activeContent}
        </main>

        ${renderModal(t)}
      `;
    }

    function handleSearchInput(val) {
      state.searchQuery = val;
      render();
      const input = document.getElementById("search-input");
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    render();
  </script>
</body>
</html>
